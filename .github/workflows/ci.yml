name: TRLC CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Bazel Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pylint==3.3.9
          python3 -m pip install --no-deps bmw-lobster-core bmw-lobster-tool-trlc
      - name: Executing Lint (pylint + ty)
        run: |
          bazel build --config=lint //trlc //:trlc_binary //:root_scripts_lib
      - name: Format check (ruff + buildifier)
        run: |
          bazel run //:format.check
  test:
    name: TestSuite
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        py-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-24.04
          - os: windows-2022
          - os: macos-14
            brew: "/opt/homebrew"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py-version }}
      - name: Add GNU find from Git for Windows to PATH
        if: matrix.os == 'windows-2022'
        run: |
          $git_exe = (Get-Command git -ErrorAction Stop).Source
          $git_root = Split-Path (Split-Path $git_exe -Parent) -Parent
          $gnu_bin = Join-Path $git_root "usr\bin"
          if (-not (Test-Path $gnu_bin)) {
            throw "GNU tools path not found: $gnu_bin"
          }
          $gnu_bin | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements_dev.txt
      - name: Install gnu make on macos
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install make
          echo "${{ matrix.brew }}/opt/make/libexec/gnubin" >> $GITHUB_PATH
      - name: Executing unit tests
        run: |
          make unit-tests
      - name: Executing system tests
        run: |
          make system-tests-all
      - name: Coverage analysis
        run: |
          make coverage
      - name: Check output files
        if: always()
        run: |
          util/check_local_modifications.sh
  failure:
    name: Check all jobs
    needs: test
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Failure
        run: exit 1
